<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Financial dashboard design QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #ececf0; color: #1d1d1f; font: 14px/1.4 system-ui, sans-serif; }
      h1 { margin: 0 0 20px; font-size: 22px; }
      h2 { margin: 0 0 10px; font-size: 15px; }
      .desktop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
      .mobile { display: flex; gap: 32px; align-items: flex-start; margin-top: 24px; }
      figure { margin: 0; min-width: 0; }
      img { display: block; max-width: 100%; height: auto; border: 1px solid #c7c7cc; background: white; }
      .mobile img { width: 375px; }
    </style>
  </head>
  <body>
    <h1>Financial dashboard — approved reference vs implementation</h1>
    <section class="desktop">
      <figure>
        <h2>Reference · 1440 × 900 · available/provisional</h2>
        <img src="dashboard-reference-1440x900.png" alt="Approved desktop reference" />
      </figure>
      <figure>
        <h2>Implementation · 1440 × 900 · available/provisional</h2>
        <img src="dashboard-implementation-available-1440x900.png" alt="Desktop implementation" />
      </figure>
    </section>
    <section class="mobile">
      <figure>
        <h2>Reference · 375 × 812 · available/provisional</h2>
        <img src="dashboard-reference-375x812.png" alt="Approved mobile reference" />
      </figure>
      <figure>
        <h2>Implementation · 375 × 812 · available/provisional</h2>
        <img src="dashboard-implementation-available-375x812.png" alt="Mobile implementation" />
      </figure>
    </section>
  </body>
</html>
